<!DOCTYPE html>
<div class="lightbox" id="lightbox">
  <span class="lightbox-close" onclick="closeLightbox()">×</span>
  <img id="lightboxImg" src="" alt="Foto ampliada">
</div>

<div class="pix-modal" id="pixModal">
  <div class="pix-box">
    <h3>Como presentear via PIX 💛</h3>
    <p style="margin:1rem 0;">1. Abra o app do seu banco<br>
    2. Vá na opção PIX<br>
    3. Escolha pagar ou transferir<br>
    4. Cole a chave abaixo<br>
    5. Confirme o valor do presente</p>
    <div class="pix-key">17997474884</div>
    <button class="pix" onclick="copyPixKey()" style="margin-top:1rem;">Copiar chave PIX</button>
    <button class="card" onclick="closePixModal()" style="margin-top:.5rem;">Fechar</button>
  </div>
</div>

<script>
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
  });
  document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

  function toggleGallery(){ document.getElementById('galleryMore').classList.toggle('active'); }
  function openPixModal(){ document.getElementById('pixModal').classList.add('active'); }
  // Mensagens dos convidados (salvas no navegador)
  const form = document.getElementById('messageForm');
  const list = document.getElementById('messagesList');

  function renderMessages(){
    const msgs = JSON.parse(localStorage.getItem('weddingMessages') || '[]');
    list.innerHTML = msgs.map(m => `
      <div style="background:#fff;border-radius:18px;padding:1.5rem 1.6rem;box-shadow:0 10px 30px rgba(0,0,0,0.05);">
        <strong style="font-family:'Playfair Display',serif;font-size:1.1rem;">${m.name}</strong>
        <p style="margin-top:.4rem;color:#555;">${m.text}</p>
      </div>
    `).join('');
  }

  if(form){
    form.addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('guestName').value.trim();
      const text = document.getElementById('guestMessage').value.trim();
      if(!name || !text) return;
      const msgs = JSON.parse(localStorage.getItem('weddingMessages') || '[]');
      msgs.unshift({ name, text });
      localStorage.setItem('weddingMessages', JSON.stringify(msgs));
      form.reset();
      renderMessages();
    });
    renderMessages();
  }

  function closePixModal(){ document.getElementById('pixModal').classList.remove('active'); }
  function copyPixKey(){ navigator.clipboard.writeText('17997474884'); alert('Chave PIX copiada! 💛'); }

  const weddingDate = new Date('2026-07-18T00:00:00');
  const countdownEl = document.getElementById('countdown');
  function updateCountdown(){
    const diff = weddingDate - new Date();
    if(diff<=0){ countdownEl.innerHTML='Hoje é o grande dia! 💍'; return; }
    const d=Math.floor(diff/(1000*60*60*24));
    const h=Math.floor((diff/(1000*60*60))%24);
    const m=Math.floor((diff/(1000*60))%60);
    const s=Math.floor((diff/1000)%60);
    countdownEl.innerHTML=`Faltam <strong>${d}</strong> dias • <strong>${h}</strong>h • <strong>${m}</strong>m • <strong>${s}</strong>s`;
  }
  setInterval(updateCountdown,1000); updateCountdown();

  // Lightbox galeria
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  document.querySelectorAll('.gallery-item img').forEach(img => {
    img.addEventListener('click', () => {
      lightboxImg.src = img.src;
      lightbox.classList.add('active');
    });
  });
  function closeLightbox(){ lightbox.classList.remove('active'); }
</script>

</body>
</html>
